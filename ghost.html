<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quick Capture</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: rgba(247, 241, 232, 0.9);
      --text: #201714;
      --border: rgba(87, 55, 34, 0.14);
      --accent: #a44a2b;
      --placeholder: rgba(32, 23, 20, 0.45);
      --glass: rgba(255, 255, 255, 0.36);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: rgba(23, 19, 17, 0.9);
        --text: rgba(252, 245, 237, 0.94);
        --border: rgba(255, 236, 221, 0.14);
        --accent: #df7d57;
        --placeholder: rgba(252, 245, 237, 0.42);
        --glass: rgba(255, 255, 255, 0.06);
      }
    }

    body {
      font-family: "SF Pro Text", "Avenir Next", -apple-system, BlinkMacSystemFont, sans-serif;
      background: transparent;
      -webkit-font-smoothing: antialiased;
    }

    .ghost-container {
      position: relative;
      background: linear-gradient(180deg, rgba(255,255,255,0.2), transparent), var(--bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 6px;
      box-shadow: 0 28px 70px rgba(34, 20, 13, 0.3);
      display: flex;
      align-items: center;
      gap: 14px;
      backdrop-filter: blur(18px);
      overflow: hidden;
    }

    .ghost-container::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top left, rgba(164, 74, 43, 0.18), transparent 34%);
      pointer-events: none;
    }

    .ghost-icon {
      width: 46px;
      height: 46px;
      background: linear-gradient(135deg, var(--accent), #d98b62);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-left: 10px;
      box-shadow: 0 16px 30px rgba(164, 74, 43, 0.25);
      position: relative;
      z-index: 1;
    }

    .ghost-icon svg {
      width: 22px;
      height: 22px;
      color: white;
    }

    .ghost-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 17px;
      font-weight: 600;
      color: var(--text);
      background: transparent;
      padding: 15px 0;
      font-family: inherit;
      position: relative;
      z-index: 1;
    }

    .ghost-input::placeholder {
      color: var(--placeholder);
    }

    .ghost-hint {
      font-size: 11px;
      color: var(--placeholder);
      padding-right: 18px;
      white-space: nowrap;
      position: relative;
      z-index: 1;
      font-weight: 600;
    }

    kbd {
      background: var(--glass);
      border: 1px solid var(--border);
      padding: 3px 7px;
      border-radius: 999px;
      font-size: 10px;
      font-family: inherit;
    }
  </style>
</head>
<body>
  <div class="ghost-container">
    <div class="ghost-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </div>
    <input
      type="text"
      class="ghost-input"
      id="ghostInput"
      placeholder="Add to This Week..."
      autofocus
    >
    <span class="ghost-hint"><kbd>↵</kbd> add <kbd>esc</kbd> cancel</span>
  </div>

  <script>
    const todayAPI = window.todayAPI;
    const input = document.getElementById('ghostInput');

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const text = input.value.trim();
        if (text) {
          todayAPI.ghostCaptureSubmit(text);
        } else {
          todayAPI.ghostCaptureCancel();
        }
      } else if (e.key === 'Escape') {
        todayAPI.ghostCaptureCancel();
      }
    });

    // Auto-focus
    setTimeout(() => input.focus(), 50);
  </script>
</body>
</html>
